services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # ホストへのポート公開はしない。backend はコンピュータ内のネットワークで db に
    # 到達でき、手元から見るときは docker compose exec db psql で足りるため。
    # 公開しないことで、他プロジェクトの PostgreSQL とポートが衝突しない。
    healthcheck:
      # backend は db が「起動した」だけでは接続できない。接続を受け付ける状態に
      # なったことを pg_isready で確認し、それを depends_on の条件にする。
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RAILS_LOG_TO_STDOUT: "true"
    volumes:
      - ./backend:/app
      - bundle_data:/usr/local/bundle
    ports:
      # ホスト側ポートは環境変数で変えられる。同じPCで別プロジェクトが同じポートを
      # 使っている場合に .env だけで回避するため。コンテナ側は常に 3000。
      - "${BACKEND_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_PUBLIC_BASE_URL: ${VITE_PUBLIC_BASE_URL}
    volumes:
      - ./frontend:/app
      # node_modules はバインドマウントで上書きされないよう、専用ボリュームに逃がす
      - node_modules_data:/app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    tty: true
    stdin_open: true

volumes:
  db_data:
  bundle_data:
  node_modules_data:
