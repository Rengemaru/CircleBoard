name: Deploy

# main に入ったら本番へ出す。普段の作業は develop に溜める。
on:
  push:
    branches: [main]
  # 手で流し直せるようにしておく。失敗したときに空コミットを積まずに再実行できる
  workflow_dispatch:

# 同時に2つ走らせない。後から入った方が古いイメージを上書きしうる
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # **cache-to: type=gha には docker-container ドライバが要る。**
      # ランナーの既定は docker ドライバで、キャッシュの書き出しに対応していない
      # ("Cache export is not supported for the docker driver" で初回が落ちた)
      - uses: docker/setup-buildx-action@v3

      # ghcr.io は所有者名が小文字でないと通らない（Rengemaru → rengemaru）
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VPS では docker build を走らせない。2GB しかなくメモリ不足で落ちる
      # (docs/spec-v2.2.md §7.4)。ビルドをここに寄せることが CD の目的。
      #
      # タグを2つ付ける。:latest は compose が見るもの、
      # :<sha> は切り戻し先を指名するためのもの(docs/runbook.md §2)
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/circleboard-backend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/circleboard-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/circleboard-frontend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/circleboard-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # イメージだけ更新しても compose とスクリプトは古いまま。
      # ここを送らないと、docker-compose.prod.yml を直しても本番に届かない
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,ops/*"
          target: /opt/circleboard
          overwrite: true

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # 1つでも失敗したらそこで止める。半分だけ進んだ状態を作らない
          script_stop: true
          script: |
            # **script_stop だけに頼らない。** 初回のデプロイで db:migrate が
            # 失敗したのに後続が動き、最後の curl まで進んでしまった。
            # 途中で失敗したら、そこで止める
            set -e
            cd /opt/circleboard
            # scp は実行ビットを落とす。cron が Permission denied になる
            chmod +x ops/*.sh
            # **戻せない状態で自動デプロイを回さない**
            ./ops/backup.sh
            dc() { docker compose -f docker-compose.prod.yml --env-file .env.production "$@"; }
            dc pull
            dc up -d
            # 起動時には走らせない設計なので、ここで明示的に打つ
            # (backend/Dockerfile の CMD に入れると、コンテナを2つ立てたときに
            #  同時に走って事故る)
            dc exec -T backend bin/rails db:migrate
            dc ps

            # **http://localhost では届かない。** SITE_ADDRESS にドメインを
            # 入れた時点で、Host: localhost は Caddy のサイトブロックに
            # 一致しなくなり、自動HTTPSの 308 が返るだけになった。
            # curl -f は 4xx/5xx でしか失敗しないので、
            # **Rails が落ちていてもデプロイが緑になっていた。**
            #
            # .env.production は source しない(シェルのファイルではない)。
            # sed で1行だけ取り出す
            SITE=$(sed -n 's/^SITE_ADDRESS=//p' .env.production)
            case "$SITE" in
              # ドメインがまだ無い期間(SITE_ADDRESS=:80)。素のHTTPで届く
              :*) check() { curl -fsS http://localhost/healthz | grep -q '"status":"ok"'; } ;;
              # --resolve で、名前は本物・宛先は自分自身にする。
              # **証明書もここで検証される。** 期限切れや取得失敗を
              # デプロイのたびに拾える(更新は90日ごとで、他に気づく手段が無い)
              *)  check() { curl -fsS --resolve "${SITE}:443:127.0.0.1" "https://${SITE}/healthz" | grep -q '"status":"ok"'; } ;;
            esac

            # **中身まで見る。** 200 が返るだけでは足りない。Caddy が
            # SPA の index.html を返していても 200 になる
            #
            # up -d の直後は Puma がまだ待ち受けておらず 502 になる
            # (初回のデプロイで実際に出た)。30秒待っても返らなければ、
            # それは本当に起動できていない
            for i in $(seq 1 15); do
              check && break
              echo "起動待ち ${i}/15"
              sleep 2
            done
            # ここが失敗したらデプロイは赤。出たつもりで壊れている状態を作らない
            check
