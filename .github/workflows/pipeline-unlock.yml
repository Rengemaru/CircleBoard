name: Pipeline Unlock

# サブIssue の PR がマージされたら、同じ親の次のサブIssue に claude:implement を
# 付けて実装担当を起動する(claude-pipeline-spec.md §7.2)。
#
# 「親Issue内は直列」(非交渉事項 #2)を実現しているのがこのワークフロー。
# 兄弟のサブIssue を同時に走らせると、同じ計画から出た PR どうしが
# 共有ファイルで競合するため、1本マージされてから次を出す。
#
# LLM は使わない。「order が現在より大きい最小のものを選ぶ」は決定論的に書ける
# 処理で、ここに LLM を挟む理由がない(非交渉事項 #10)。
#
# GITHUB_TOKEN ではなくカスタム App のトークンを使う。GITHUB_TOKEN で付けた
# ラベルは他のワークフローを起動しないため(GitHub の再帰防止)、
# claude-implement.yml が動かない(claude-pipeline-spec.md §8.1)。
on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  unlock:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate app token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}

      - name: Unlock the next subtask
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # 1. PR 本文の Closes #N からサブIssue を辿る(spec §4.3)
          closed_issue="$(printf '%s\n' "$PR_BODY" \
            | sed -n 's/.*[Cc]loses #\([0-9][0-9]*\).*/\1/p' | head -1)"

          if [ -z "$closed_issue" ]; then
            echo "::warning::PR 本文に Closes #N がないため、次のサブIssueを特定できません"
            exit 0
          fi
          echo "closed subtask: #${closed_issue}"

          # 2. メタデータブロックから parent と order を読む(spec §4.2)。
          #    形式は grep/sed で読める単純さを保っている
          body="$(gh issue view "$closed_issue" --json body --jq .body)"
          parent="$(printf '%s\n' "$body" | sed -n 's/^parent: *\([0-9][0-9]*\).*$/\1/p' | head -1)"
          order="$(printf '%s\n' "$body" | sed -n 's/^order: *\([0-9][0-9.]*\).*$/\1/p' | head -1)"

          if [ -z "$parent" ] || [ -z "$order" ]; then
            echo "::warning::#${closed_issue} にメタデータブロックがありません"
            exit 0
          fi
          echo "parent: #${parent} / order: ${order}"

          # 3. 同じ親の open なサブIssue から、order が現在より大きい最小のものを選ぶ
          next_number=""
          next_order=""
          for n in $(gh issue list --label pipeline:subtask --state open \
                       --limit 200 --json number --jq '.[].number'); do
            b="$(gh issue view "$n" --json body --jq .body)"
            p="$(printf '%s\n' "$b" | sed -n 's/^parent: *\([0-9][0-9]*\).*$/\1/p' | head -1)"
            o="$(printf '%s\n' "$b" | sed -n 's/^order: *\([0-9][0-9.]*\).*$/\1/p' | head -1)"

            [ "$p" = "$parent" ] || continue
            [ -n "$o" ] || continue

            # order は小数を許容する(spec §4.2)ので awk で比較する
            awk -v a="$o" -v b="$order" 'BEGIN { exit !(a > b) }' || continue
            if [ -z "$next_order" ] || awk -v a="$o" -v b="$next_order" 'BEGIN { exit !(a < b) }'; then
              next_number="$n"
              next_order="$o"
            fi
          done

          # 4. 選べたら claude:implement を付ける。これが実装担当を起動する
          if [ -n "$next_number" ]; then
            echo "next subtask: #${next_number} (order ${next_order})"
            gh issue edit "$next_number" --add-label claude:implement
            exit 0
          fi

          # 5. 残りがなければ親に報告する。親Issue は閉じない。
          #    閉じるのはユーザーで、閉じるとキルスイッチが動く(spec §7.2-5)
          gh issue comment "$parent" --body "$(printf '%s\n' \
            'すべてのサブタスクが完了しました。' \
            '' \
            'この親Issue を閉じると、残りのサブIssue・PR・実行中ジョブを停止するキルスイッチが動きます。')"
